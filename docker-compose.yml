services:
  homecook:
    # 直接拉取 CI 构建好的多架构镜像；本地开发可改用：
    #   docker build -t ghcr.io/mjy378283319/homecook:latest .
    image: ghcr.io/mjy378283319/homecook:latest
    container_name: homecook
    ports:
      - "9926:8000"
    environment:
      - WEB_USER=admin
      - WEB_PASSWORD=changeme
      - SECRET_KEY=please-change-to-a-random-string
      - TZ=Asia/Shanghai
      - DB_PATH=/data/homecook.db
    volumes:
      - homecook-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  homecook-data:
