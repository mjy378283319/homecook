name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  smoke:
    # 真正把镜像跑起来：验健康检查、登录、封面图上传与持久化
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build amd64 image
        run: docker build -t homecook:smoke .

      - name: Run container
        run: |
          mkdir -p "$PWD/smoke-data"
          docker run -d --name homecook-smoke -p 18000:8000 \
            -e WEB_USER=admin \
            -e WEB_PASSWORD=smoke-test-pw \
            -e SECRET_KEY=smoke-secret \
            -v "$PWD/smoke-data:/data" \
            homecook:smoke

      - name: Wait until healthy
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/healthz; then
              echo; echo "healthy after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "--- container logs ---"
          docker logs homecook-smoke
          exit 1

      - name: Cover upload round-trip
        run: |
          set -euo pipefail
          base=http://127.0.0.1:18000
          python3 -c "import base64,pathlib; pathlib.Path('test.png').write_bytes(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='))"

          curl -fsS -c cookie.txt -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-test-pw"}' "$base/api/login" > /dev/null

          rid=$(curl -fsS -b cookie.txt -X POST -H 'Content-Type: application/json' \
            -d '{"title":"smoke","ingredients":[],"steps":[]}' "$base/api/recipes" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          echo "recipe id = $rid"

          cover=$(curl -fsS -b cookie.txt -F "file=@test.png" "$base/api/recipes/$rid/cover" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["cover"])')
          echo "cover = $cover"

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base$cover")
          echo "GET cover -> $code"
          test "$code" = "200"

          # 必须是 JPEG 且落在挂载的数据卷里，证明 Pillow 路径与持久化都正常
          case "$cover" in
            *.jpg) echo "Pillow 压缩路径生效" ;;
            *) echo "::warning::封面未走压缩路径（降级为原图）" ;;
          esac
          test -n "$(ls -A smoke-data/covers)"

      - name: Nutrition round-trip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, http.cookiejar

          base = "http://127.0.0.1:18000"
          jar = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              with op.open(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          call("POST", "/api/login", {"username": "admin", "password": "smoke-test-pw"})

          # 指标顺序必须固定
          want = ["卡路里", "碳水化合物", "胆固醇", "脂肪", "纤维", "蛋白质",
                  "饱和脂肪", "钠", "糖", "反式脂肪", "不饱和脂肪"]
          got = [m["label"] for m in call("GET", "/api/meta/options")["nutrition"]]
          assert got == want, f"metric order mismatch: {got}"

          # 自动估算：鸡蛋 3 个（50g/个）+ 西红柿 2 个（150g/个）+ 盐 2g
          rec = call("POST", "/api/recipes", {
              "title": "smoke-nutrition", "servings": 2,
              "ingredients": [
                  {"name": "鸡蛋", "quantity": 3, "unit": "个"},
                  {"name": "西红柿", "quantity": 2, "unit": "个"},
                  {"name": "盐", "quantity": 2, "unit": "克"},
              ],
              "steps": [{"step_no": 1, "text": "smoke"}],
          })
          rid = rec["id"]
          n = rec["nutrition"]
          assert n["mode"] == "auto", n["mode"]
          assert n["matched"] == 3 and n["total_items"] == 3, (n["matched"], n["total_items"])
          assert abs(n["covered_g"] - 452) < 1, n["covered_g"]          # 150+300+2
          assert n["per_serving"]["calories"] > 100, n["per_serving"]["calories"]
          assert 420 < n["per_serving"]["cholesterol"] < 460, n["per_serving"]["cholesterol"]
          assert n["per_serving"]["sodium"] > 300, n["per_serving"]["sodium"]
          assert set(n["metrics"][0]) >= {"key", "label", "unit", "dec"}
          print("auto ok:", n["per_serving"]["calories"], "kcal/份, 计入", n["covered_g"], "g")

          # 改人份 → 每份重算
          total = n["total"]["calories"]
          rec2 = call("PUT", f"/api/recipes/{rid}", {
              "title": "smoke-nutrition", "servings": 4,
              "ingredients": [
                  {"name": "鸡蛋", "quantity": 3, "unit": "个"},
                  {"name": "西红柿", "quantity": 2, "unit": "个"},
                  {"name": "盐", "quantity": 2, "unit": "克"},
              ],
              "steps": [{"step_no": 1, "text": "smoke"}],
          })
          assert abs(rec2["nutrition"]["total"]["calories"] - total) < 1, "总量应与人份无关"
          assert abs(rec2["nutrition"]["per_serving"]["calories"] - total / 4) < 1, "每份应随人份变化"
          print("servings ok:", rec2["nutrition"]["per_serving"]["calories"], "kcal/份")

          # 手动覆盖 → 每份 = 全锅 ÷ 人份
          rec3 = call("PUT", f"/api/recipes/{rid}/nutrition",
                      {"mode": "manual", "values": {"calories": 800, "protein": 40}})
          n3 = rec3["nutrition"]
          assert n3["mode"] == "manual" and n3["total"]["calories"] == 800
          assert n3["per_serving"]["calories"] == 200 and n3["per_serving"]["protein"] == 10
          print("manual ok: 全锅 800 → 每份", n3["per_serving"]["calories"])

          # 切回自动 → 重新估算
          rec4 = call("PUT", f"/api/recipes/{rid}/nutrition", {"mode": "auto"})
          assert rec4["nutrition"]["mode"] == "auto"
          assert abs(rec4["nutrition"]["total"]["calories"] - total) < 1
          print("back to auto ok")

          # 食材每 100g 修改
          ing = next(i for i in call("GET", "/api/ingredients") if i["name"] == "鸡蛋")
          call("PATCH", f"/api/ingredients/{ing['id']}/nutrition",
               {"calories_per100": 150, "gram_per_unit": 55})
          ing2 = next(i for i in call("GET", "/api/ingredients") if i["name"] == "鸡蛋")
          assert ing2["calories_per100"] == 150 and ing2["gram_per_unit"] == 55
          assert ing2["sodium_per100"] > 0, "PATCH 不应清空其他营养字段"
          print("ingredient patch ok")

          call("DELETE", f"/api/recipes/{rid}")
          print("nutrition smoke passed")
          PY

      - name: Dump logs on failure
        if: failure()
        run: docker logs homecook-smoke || true
